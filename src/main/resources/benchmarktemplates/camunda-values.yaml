# Chart values for the Camunda Platform 8 Helm chart.
# This file deliberately contains only the values that differ from the defaults.
# For changes and documentation, use your favorite diff tool to compare it with:
# https://github.com/camunda/camunda-platform-helm/blob/main/charts/camunda-platform/values.yaml

global:
  ingress:
    enabled: true
    className: nginx
    host: orchestration-benchmark-test.ci.distro.ultrawombat.com
    tls:
      enabled: true
      secretName: camunda-platform
  # DEPRECATED in 8.9 - use optimize.database.elasticsearch / orchestration.data.secondaryStorage.elasticsearch instead.
  # Kept for now since it still drives the secondary storage selection via a compatibility fallback.
  elasticsearch:
    enabled: true

orchestration:
  nodeSelector:
    node.kubernetes.io/instance-type: ${engine.machineType}
  profiles:
    operate: ${operate.enabled}
    tasklist: ${operate.enabled}
  exporters:
    camunda:
      enabled: ${elasticSearch.enabled}
    zeebe:
      enabled: false
    rdbms:
      enabled: false
  contextPath: /
  ingress:
    grpc:
      enabled: true
      className: nginx
      host: grpc-orchestration-benchmark-test.ci.distro.ultrawombat.com
      tls:
        enabled: true
        secretName: camunda-platform-zeebe-gateway
  security:
    authentication:
      method: basic
      unprotectedApi: true
    authorizations:
      enabled: false
  resources:
    requests:
      cpu: "${engine.vcpuRequest}"
      memory: ${engine.ram}Gi
    limits:
      cpu: null
      memory: ${engine.ram}Gi
  clusterSize: "${engine.clusterSize}"
  partitionCount: "${engine.partitions}"
  replicationFactor: "${engine.replicationFactor}"
  cpuThreadCount: "${engine.cpuThreadPoolSizeNode}"
  ioThreadCount: "${engine.ioThreadPoolSizeNode}"
  persistenceType: ${engine.diskType}
  pvcSize: ${engine.diskSize}Gi
  pvcStorageClassName: ${engine.fileSystem}
  javaOpts: "-XX:+Use${jvm.garbageCollector}GC"
  # Environment variables that CANNOT be expressed via extraConfiguration:
  # the Zeebe/Camunda log4j2.xml resolves these through Log4j2 ${env:...} lookups
  # (not Spring's Environment), and ZEEBE_LOG_STACKDRIVER_SERVICEVERSION additionally
  # relies on the Kubernetes downward API. They must stay as container env vars.
  env:
    # Enable JSON logging for Google Cloud Stackdriver
    - name: ZEEBE_LOG_APPENDER
      value: Stackdriver
    - name: ZEEBE_LOG_STACKDRIVER_SERVICENAME
      value: zeebe
    - name: ZEEBE_LOG_STACKDRIVER_SERVICEVERSION
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  # All remaining application configuration is layered on top of the chart's default
  # application.yaml via extraConfiguration (Camunda 8.9+ ordered-list form). Each entry
  # is mounted as its own file and imported through Spring's spring.config.import, so the
  # chart-provided defaults stay intact and we only carry the deltas we care about.
  # See https://docs.camunda.io/docs/self-managed/deployment/helm/configure/application-configs/
  #
  # NOTE (redundant env removed): CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI and
  # CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED used to be set as env vars, but they are already
  # configured natively above via orchestration.security.* — so they were dropped.
  extraConfiguration:
    - file: benchmark-orchestration.yaml
      content: |
        camunda:
          cluster:
            raft:
              # was ZEEBE_BROKER_CLUSTER_RAFT_FLUSH_DELAYTIME -> zeebe.broker.cluster.raft.flush.delayTime,
              # but that legacy path is a read-only mirror in 8.9 (verified via /actuator/configprops:
              # the effective flushDelay stayed PT0S). This is the live 8.9 property.
              flush-delay: "${engine.raftFlushDelay}"
          database:
            schema-manager:
              # comment out / set elasticSearch.enabled=false to disable schema creation
              create-schema: "${elasticSearch.enabled}"
          data:
            primary-storage:
              log-stream:
                log-segment-size: "${engine.logSegmentSize}MB"
              rocks-db:
                # was CAMUNDA_DATAPRIMARYSTORAGE_ROCKSDB_WALDISABLED (missing underscore ->
                # never bound to data.primary-storage); corrected to the real property path.
                wal-disabled: "${rocksdb.disableWal}"
            secondary-storage:
              elasticsearch:
                # Live 8.9 home of the former CAMUNDA_OPERATE|TASKLIST_ELASTICSEARCH_NUMBEROFSHARDS
                # and _NUMBEROFREPLICAS: shards/replicas for the indices written by the unified
                # "camunda" exporter. The per-webapp camunda.operate|tasklist.elasticsearch.* paths
                # are ignored in 8.9.
                number-of-shards: "${elasticSearch.shardsPerIndex}"
                number-of-replicas: "1"
          processing:
            flow-control:
              request:
                enabled: "${engine.backpressure}"
                windowed: "${engine.bpUseWindowed}"
                algorithm: "${engine.backPressureAlgorithm}"
                fixed:
                  limit: "${engine.initialLimit}"
                vegas:
                  initial-limit: "${engine.initialLimit}"
                  alpha: "${engine.vegasAlpha}"
                  beta: "${engine.vegasBeta}"
                gradient:
                  min-limit: "${engine.minLimit}"
                  initial-limit: "${engine.initialLimit}"
                  rtt-tolerance: "${engine.rttTolerance}"
          # ---------------------------------------------------------------------
          # Operate / Tasklist tuning - migrated from the former
          # CAMUNDA_OPERATE_* / CAMUNDA_TASKLIST_* env vars.
          #
          # WARNING (verified against 8.9 via /actuator/configprops): the keys below
          # are INERT in the 8.9 unified orchestration cluster. The per-webapp
          # Operate/Tasklist importers were replaced by the single "camunda" exporter,
          # so archiver.*, importer.* and zeebeElasticsearch.* no longer exist on
          # OperateProperties/TasklistProperties and are silently ignored (they were
          # equally ignored as env vars - this is a pre-existing no-op, not new).
          # Kept as documented no-ops:
          #   - importer.* (queueSize/readerThreadsCount/threadsCount),
          #     archiver.threadsCount and zeebeElasticsearch.batchSize
          #       -> no direct equivalent (importer architecture removed)
          #   - archiver.rolloverBatchSize
          #       -> live home would be
          #          camunda.data.secondary-storage.elasticsearch.history.rollover-batch-size
          #          (deliberately not rewired yet)
          # Already REWIRED to their live 8.9 home (no longer set here):
          #   - elasticsearch.numberOfShards / numberOfReplicas
          #       -> camunda.data.secondary-storage.elasticsearch.number-of-shards /
          #          -number-of-replicas (see above)
          # ---------------------------------------------------------------------
          operate:
            archiver:
              rolloverBatchSize: "${operate.archRolloverBatchSize}"
              threadsCount: "${operate.archThreads}"
            importer:
              queueSize: "${operate.importerQueueSize}"
              readerThreadsCount: "${operate.importerReaderThreads}"
              threadsCount: "${operate.importerThreads}"
            zeebeElasticsearch:
              batchSize: "${operate.importPageSize}"
          tasklist:
            archiver:
              rolloverBatchSize: "${operate.archRolloverBatchSize}"
              threadsCount: "${operate.archThreads}"
            importer:
              queueSize: "${operate.importerQueueSize}"
              readerThreadsCount: "${operate.importerReaderThreads}"
              threadsCount: "${operate.importerThreads}"
            zeebeElasticsearch:
              batchSize: "${operate.importPageSize}"
        zeebe:
          broker:
            # ZEEBE_BROKER_EXECUTION_METRICS_EXPORTER_ENABLED and the underscore-free
            # ZEEBE_BROKER_EXECUTIONMETRICSEXPORTERENABLED both bound to this one property.
            executionMetricsExporterEnabled: true
            cluster:
              # raft flush delay is NOT set here: the legacy path
              # zeebe.broker.cluster.raft.flush.delayTime is a read-only mirror in 8.9.
              # It is rewired to the live property camunda.cluster.raft.flush-delay above.
              messageCompression: "${engine.networkCompression}"
            experimental:
              maxAppendsPerFollower: "${engine.maxAppendsPerFollower}"
              maxAppendBatchSize: "${engine.maxAppendBatchSize}KB"
              disableExplicitRaftFlush: "${engine.disableExplicitRaftFlush}"
              features:
                enableActorMetrics: true
              raft:
                preallocateSegmentFiles: "${engine.preAllocateSegmentFiles}"
              rocksdb:
                enableSstPartitioning: "${rocksdb.enableSstPartitioning}"
                memoryLimit: "${rocksdb.memoryLimit}MB"
            exporters:
              # Export to a separate Elasticsearch for Optimize.
              # NOTE: must be namespace-qualified - orchestration (namespace: camunda, see
              # Makefile) and optimize (namespace: camunda-optimize, see elasticsearch-optimize.mk)
              # are different namespaces, so the bare service name does not resolve across them.
              # comment out this exporter when disabling Elasticsearch, i.e. elasticSearch.enabled=false
              elasticsearch:
                className: io.camunda.zeebe.exporter.ElasticsearchExporter
                args:
                  url: http://optimize-elasticsearch.camunda-optimize.svc.cluster.local:9200
                  index:
                    numberOfShards: "${elasticSearch.shardsPerIndex}"
                    numberOfReplicas: "1"
                    optimizeModeEnabled: true
                    variable: "${optimize.indexVariables}"

connectors:
  enabled: false
  contextPath: /connectors

webModeler:
  enabled: false
  image:
    pullSecrets:
      - name: camunda-docker-registry
  restapi:
    mail:
      fromAddress: YOUR_EE_EMAIL

console:
  enabled: false
  contextPath: /console

# DEPRECATED in 8.9 - the bundled Keycloak subchart is deprecated; prefer an external OIDC provider.
identityKeycloak:
  # enabled: ${optimize.enabled}
  enabled: false
  postgresql:
    primary:
      resourcesPreset: micro
    auth:
      existingSecret: "integration-test-credentials"
      secretKeys:
        adminPasswordKey: "identity-keycloak-postgresql-admin-password"
        userPasswordKey: "identity-keycloak-postgresql-user-password"
  auth:
    existingSecret: "integration-test-credentials"
    passwordSecretKey: "identity-keycloak-admin-password"

prometheusServiceMonitor:
  enabled: true

# DEPRECATED in 8.9 - the bundled Elasticsearch subchart is deprecated; prefer an external Elasticsearch/OpenSearch.
elasticsearch:
  enabled: ${elasticSearch.enabled}
  image:
    tag: ${elasticSearch.version}
  master:
    masterOnly: ${elasticSearch.masterOnly}
    replicaCount: ${elasticSearch.clusterSizeMaster}
    nodeSelector:
      node.kubernetes.io/instance-type: ${engine.machineType}
    resources:
      requests:
        cpu: ${elasticSearch.vcpusMasterRequests}
        memory: ${elasticSearch.ramMaster}Gi
      limits:
        cpu: ${elasticSearch.vcpusMaster}
        memory: ${elasticSearch.ramMaster}Gi
    heapSize: ${elasticSearch.heapSizeMaster}m
    persistence:
      size: ${elasticSearch.storageCapacity}Gi
      storageClass: ${elasticSearch.fileSystem}
  data:
    replicaCount: ${elasticSearch.clusterSizeData}
    nodeSelector:
      node.kubernetes.io/instance-type: ${engine.machineType}
    resources:
      requests:
        cpu: ${elasticSearch.vcpusDataRequests}
        memory: ${elasticSearch.ramData}Gi
      limits:
        cpu: ${elasticSearch.vcpusData}
        memory: ${elasticSearch.ramData}Gi
    heapSize: ${elasticSearch.heapSizeData}m
    persistence:
      size: ${elasticSearch.storageCapacity}Gi
      storageClass: ${elasticSearch.fileSystem}
  metrics:
    enabled: ${elasticSearch.enabled}
    serviceMonitor:
      enabled: true
      honorLabels: true
      namespace: default
      labels:
        release: metrics
    resourcesPreset: small
